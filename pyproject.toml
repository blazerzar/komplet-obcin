[project]
name = "komplet-obcin"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Anki deck for learning Slovene municipalities"
readme = "README.md"
authors = [{ name = "Blaž Erzar", email = "blaz.erzar@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "genanki>=0.13.1",
  "geopandas>=1.1.4",
  "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["ruff>=0.16.9"]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"
